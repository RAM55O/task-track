services:
  mongodb:
    image: mongo:7.0
    container_name: tasktrack-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tasktrack-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/tasktrack
    depends_on:
      - mongodb

volumes:
  mongo_data: