name: TaskTrack CI/CD Pipeline (Zero Cost, No Accounts)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-scan-deploy:
    name: Build, Scan & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 1. Trivy File System Scan
      - name: Trivy FS Scan (Source Code & Secrets)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      # 2. Trivy Helm Config Scan
      - name: Trivy Config Scan (Helm Chart)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'tasktrack/'
          severity: 'HIGH,CRITICAL'
          exit-code: '0'

      # 3. Create Short SHA and Lowercase Repo Owner Variable
      - name: Set Variables
        id: vars
        run: |
          echo "SHA_TAG=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT
          echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 4. Login to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5. Build and Push Docker Image to GHCR
      - name: Build and Push Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ steps.vars.outputs.REPO_OWNER }}/task-track-app:${{ steps.vars.outputs.SHA_TAG }}"
          
          docker build -t $IMAGE_NAME .
          
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            docker push $IMAGE_NAME
          fi

      # 6. Image Vulnerability Scan (Now using lowercase repo owner)
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/${{ steps.vars.outputs.REPO_OWNER }}/task-track-app:${{ steps.vars.outputs.SHA_TAG }}'
          severity: 'HIGH,CRITICAL'
          format: 'table'
          exit-code: '0'

      # 7. GitOps Update for Argo CD
      - name: Update Helm Image Tag in Git
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Replace tag in values.yaml
          sed -i 's/tag: .*/tag: "'${{ steps.vars.outputs.SHA_TAG }}'"/' tasktrack/values.yaml
          
          # Replace the image repository to point to GitHub Container Registry
          sed -i 's|repository: .*|repository: ghcr.io/${{ steps.vars.outputs.REPO_OWNER }}/task-track-app|' tasktrack/values.yaml
          
          git add tasktrack/values.yaml
          git diff --quiet && git diff --staged --quiet || (git commit -m "ci: bump image tag and repo to GHCR [skip ci]" && git push origin main)